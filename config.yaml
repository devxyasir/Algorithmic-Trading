# Trading Analysis Configuration

trading:
  default_timeframe: "1d"  # 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1wk
  risk_per_trade_pct: 2.0  # % of capital to risk per trade
  fetch_max_data: true     # Fetch maximum available historical data
  
risk_management:
  atr_stop_multiplier: 2.5   # Stop loss = ATR × this value
  atr_target_multiplier: 5.0 # Take profit = ATR × this value
  min_risk_reward: 1.5       # Minimum risk/reward ratio
  max_position_size_pct: 10  # Max % of capital per position

indicators:
  ema_periods: [9, 20, 50, 100, 200, 250]
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  adx_period: 14
  atr_period: 14
  
analysis:
  min_confidence: 60  # Minimum confidence % to show BUY/SELL
  min_data_points: 250  # Minimum candles required
